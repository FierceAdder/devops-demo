---
- name: Configure and deploy devops-demo application
  hosts: appservers
  become: yes

  vars_files:
    - roles/webapp/vars/main.yml

  roles:
    - webapp

  tasks:
    - name: Copy application JAR to target directory
      copy:
        src: "{{ playbook_dir }}/../target/devops-demo-1.0.0.jar"
        dest: "{{ app_dest }}/devops-demo.jar"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'
      notify: restart devops-demo
