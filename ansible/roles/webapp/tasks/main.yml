---
- name: Ensure app group exists
  group:
    name: "{{ app_user }}"
    state: present

- name: Ensure app user exists
  user:
    name: "{{ app_user }}"
    group: "{{ app_user }}"
    system: yes
    shell: /bin/false

- name: Create application directory
  file:
    path: "{{ app_dest }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'

- name: Install Java runtime (OpenJDK 21)
  apt:
    name: openjdk-21-jre-headless
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Deploy systemd service unit from template
  template:
    src: devops-demo.service.j2
    dest: /etc/systemd/system/devops-demo.service
    mode: '0644'
  notify: restart devops-demo

- name: Enable devops-demo service
  systemd:
    name: devops-demo
    enabled: yes
    daemon_reload: yes
  ignore_errors: yes
